services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentcrm}
      POSTGRES_USER: ${POSTGRES_USER:-rentcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentcrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentcrm} -d ${POSTGRES_DB:-rentcrm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rentcrm}
      POSTGRES_USER: ${POSTGRES_USER:-rentcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentcrm}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_LAST: ${BACKUP_KEEP_LAST:-2}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
    volumes:
      - postgres_backups:/backups
      - ./scripts/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
    command: ["sh", "/usr/local/bin/postgres-backup.sh"]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rentcrm}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rentcrm}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rentcrm}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-secret-change-this-secret}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost}
      APP_AUTH_PUBLIC_BASE_URL: ${APP_AUTH_PUBLIC_BASE_URL:-http://localhost}
      APP_AUTH_DEV_LINKS_ENABLED: ${APP_AUTH_DEV_LINKS_ENABLED:-true}
      APP_BILLING_WEBHOOK_SECRET: ${APP_BILLING_WEBHOOK_SECRET:-}
      APP_ERROR_ALERT_EMAIL: ${APP_ERROR_ALERT_EMAIL:-}
      APP_DOCUMENT_STORAGE_DIR: ${APP_DOCUMENT_STORAGE_DIR:-/app/uploads/documents}
      APP_SERVICE_LOG_LEVEL: ${APP_SERVICE_LOG_LEVEL:-INFO}
      APP_BILLING_LOG_LEVEL: ${APP_BILLING_LOG_LEVEL:-INFO}
      APP_NOTIFICATION_LOG_LEVEL: ${APP_NOTIFICATION_LOG_LEVEL:-INFO}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@rentcrm.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - document_storage:/app/uploads/documents
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
  postgres_backups:
